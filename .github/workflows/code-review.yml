name: Code Review

on:
  pull_request:
    # PR 생성(opened)과 이후 푸시(synchronize)마다 리뷰한다.
    # 푸시가 잦으면 그만큼 구독 한도를 쓰므로 아래 concurrency로 중복 실행을 막는다.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # 액션이 OIDC로 GitHub 토큰을 발급받는다. 없으면 인증 단계에서 바로 실패한다.
  id-token: write

# 연속 푸시 시 이전 리뷰 실행을 취소한다. 커밋을 잇달아 올릴 때
# 폐기될 리뷰에 한도를 쓰는 것과 코멘트가 중첩되는 것을 함께 막는다.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Draft PR과 봇이 연 PR은 리뷰하지 않는다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4
        with:
          # 규칙 파일(.github/CODE_REVIEW.md)을 읽고 base 브랜치와 diff를 뜨려면
          # 전체 히스토리가 필요하다.
          fetch-depth: 0

      # 봇이 diff를 명령으로 뽑으면 그 턴을 쓰고, 출력이 길면 잘려서 다시 읽는 턴도 쓴다.
      - name: 리뷰할 diff를 파일로 저장
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p .code-review
          git diff -W "origin/$BASE_REF...HEAD" -- . \
            ':(exclude)package-lock.json' ':(exclude)src/demo/demoData.ts' \
            > .code-review/pr.diff
          echo "diff: $(wc -l < .code-review/pr.diff) lines"

      - uses: anthropics/claude-code-action@v1
        with:
          # anthropic_api_key를 함께 두면 안 된다. 키 쪽으로 인증을 시도한다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            이 PR을 리뷰한다. PR 브랜치는 이미 현재 작업 디렉터리에 체크아웃돼 있다.

            먼저 `.github/CODE_REVIEW.md`를 읽고 그 파일에 적힌 규칙·출력 형식·
            제외 항목을 그대로 따른다. 지적은 R0(동작이 깨지는 버그) 또는
            R1 이후 규칙에 해당하는 것만 남긴다. R0은 규칙 목록에 없는 버그도
            포함하므로, 패턴 규칙에 해당하지 않는다는 이유로 버그를 넘기지 않는다.

            지적 대상은 이 PR의 변경분뿐이다. 다른 파일은 `.github/CODE_REVIEW.md`의
            "맥락 확인"에 따라 읽되, diff에 없는 코드에 대해서는 코멘트를 남기지 않는다.

            diff는 `.code-review/pr.diff`에 저장돼 있다. lockfile과 데모 데이터 파일
            (`src/demo/demoData.ts`)은 빠져 있고, 제외한 파일은 리뷰하지 않는다.
            `git diff -W`로 만들어서 바뀐 줄이 속한 함수 전체가 함께 들어 있다.
            `+`/`-`로 시작하는 줄만 변경분이고, 나머지 줄은 맥락이며 지적 대상이 아니다.

            턴은 40회로 제한되어 있다. 다음을 지켜 턴을 아낀다.
            - diff는 위 파일을 Read로 읽는다. 길면 offset으로 이어 읽는다. diff를 명령으로 다시 뽑거나
              파일별로 나눠 읽지 않는다.
            - 맥락 확인용 Read/Grep은 한 응답에 여러 개를 묶어 병렬로 호출한다.
            - 코멘트는 마지막에 한 응답에서 한꺼번에 남긴다.
            - 단, 35번째 응답에 이르면 diff를 다 읽지 못했더라도 더 읽지 말고 그때까지 찾은 지적을
              바로 코멘트로 남긴다. 이 경우 총평에 끝까지 검토하지 못한 파일 목록을 적는다.
              턴이 끝나면 찾아둔 지적도 모두 사라진다.

            결과는 반드시 GitHub 코멘트로 남긴다. 응답 메시지로만 쓰면 아무도 보지 못한다.
            - 특정 코드 줄을 지적할 때: `mcp__github_inline_comment__create_inline_comment`
              (`confirmed: true`와 함께)
            - 전체 총평이나 "특이사항 없습니다": `gh pr comment`

          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
