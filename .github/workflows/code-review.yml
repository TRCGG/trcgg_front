name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# 연속 푸시 시 이전 리뷰 실행을 취소한다. 같은 PR에 리뷰가 중첩되는 것과
# 폐기될 실행에 토큰을 쓰는 것을 함께 막는다.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Draft PR과 봇이 연 PR은 리뷰하지 않는다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4
        with:
          # 규칙 파일(.github/CODE_REVIEW.md)을 읽고 base 브랜치와 diff를 뜨려면
          # 전체 히스토리가 필요하다.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 같은 PR에 푸시가 이어져도 코멘트를 쌓지 않고 하나를 갱신한다.
          use_sticky_comment: true
          track_progress: false

          prompt: |
            이 PR을 리뷰한다.

            먼저 `.github/CODE_REVIEW.md`를 읽고 그 파일에 적힌 규칙·출력 형식·
            제외 항목을 그대로 따른다. 그 파일이 이 리뷰의 유일한 기준이며,
            거기 없는 항목은 지적하지 않는다.

            리뷰 대상은 이 PR의 diff에 포함된 변경분뿐이다.
            base 브랜치는 `${{ github.event.pull_request.base.ref }}` 이다.
            맥락 파악을 위해 다른 파일을 읽는 것은 허용하되,
            diff에 없는 코드에 대해서는 코멘트를 남기지 않는다.

          claude_args: |
            --model claude-opus-5
            --max-turns 20
            --allowedTools Read,Grep,Glob
