name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # 액션이 OIDC로 GitHub 토큰을 발급받는다. 없으면 인증 단계에서 바로 실패한다.
  id-token: write

# 연속 푸시 시 이전 리뷰 실행을 취소한다. 같은 PR에 리뷰가 중첩되는 것과
# 폐기될 실행에 토큰을 쓰는 것을 함께 막는다.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Draft PR과 봇이 연 PR은 리뷰하지 않는다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4
        with:
          # 규칙 파일(.github/CODE_REVIEW.md)을 읽고 base 브랜치와 diff를 뜨려면
          # 전체 히스토리가 필요하다.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          # 진단용. 실패 원인을 로그에서 확인한 뒤 제거한다.
          # 켜두면 Claude의 전체 출력이 Actions 로그에 남는다.
          show_full_output: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            이 PR을 리뷰한다. PR 브랜치는 이미 현재 작업 디렉터리에 체크아웃돼 있다.

            먼저 `.github/CODE_REVIEW.md`를 읽고 그 파일에 적힌 규칙·출력 형식·
            제외 항목을 그대로 따른다. 그 파일이 이 리뷰의 유일한 기준이며,
            거기 없는 항목은 지적하지 않는다.

            리뷰 대상은 이 PR의 diff에 포함된 변경분뿐이다. `gh pr diff`로 확인한다.
            맥락 파악을 위해 다른 파일을 읽는 것은 허용하되,
            diff에 없는 코드에 대해서는 코멘트를 남기지 않는다.

            결과는 반드시 GitHub 코멘트로 남긴다. 응답 메시지로만 쓰면 아무도 보지 못한다.
            - 특정 코드 줄을 지적할 때: `mcp__github_inline_comment__create_inline_comment`
              (`confirmed: true`와 함께)
            - 전체 총평이나 "특이사항 없습니다": `gh pr comment`

          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
